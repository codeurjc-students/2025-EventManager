name: CI

on:
  push:
    branches:
      - main
      - develop
      - release/**
      - hotfix/**
  pull_request:
    branches:
      - main
      - develop
      - release/**
      - hotfix/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (skip tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Build (skip tests)
        run: mvn -B -Punit -DskipTests package

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-target
          path: target/**
          if-no-files-found: error

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      - name: Run unit profile tests
        run: mvn -B -Punit test

      - name: Upload surefire reports (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-unit
          path: target/surefire-reports/**
          if-no-files-found: ignore

  selenium:
    name: Selenium tests (${{ matrix.suiteName }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - suiteName: Auth
            suiteInclude: "**/selenium/views/AuthViewsSeleniumTest.java"
          - suiteName: Home
            suiteInclude: "**/selenium/views/HomeViewSeleniumTest.java"
          - suiteName: Event
            suiteInclude: "**/selenium/views/EventViewsSeleniumTest.java"
          - suiteName: User
            suiteInclude: "**/selenium/views/UserViewsSeleniumTest.java"
          - suiteName: GiftAndTicket
            suiteInclude: "**/selenium/views/GiftAndTicketViewsSeleniumTest.java"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eventmanager
          POSTGRES_USER: eventmanager
          POSTGRES_PASSWORD: eventmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U eventmanager -d eventmanager"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://localhost:5432/eventmanager
      DB_USERNAME: eventmanager
      DB_PASSWORD: eventmanager
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: event-manager-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      - name: Start MinIO
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=${MINIO_ACCESS_KEY} \
            -e MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY} \
            minio/minio:RELEASE.2024-01-16T16-07-38Z server /data --console-address ":9001"

      - name: Run selenium profile tests (shard)
        run: mvn -B -Pselenium,selenium-ci -Dselenium.includes="${{ matrix.suiteInclude }}" test

      - name: Upload surefire reports (selenium)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-selenium
          path: target/surefire-reports/**
          if-no-files-found: ignore

      - name: Upload backend startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-${{ matrix.suiteName }}
          path: app.log
          if-no-files-found: ignore

  coverage:
    name: Coverage (JaCoCo)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Maven
        run: |
          sudo apt-get update
          sudo apt-get install -y maven

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-target
          path: .

      - name: Run verify with unit profile (JaCoCo report)
        run: mvn -B -Punit verify

      - name: Upload JaCoCo site
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-site
          path: target/site/jacoco/**
          if-no-files-found: error

      - name: Upload JaCoCo XML
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: target/site/jacoco/jacoco.xml
          if-no-files-found: error
