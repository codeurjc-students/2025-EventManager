services:
  db:
    image: postgres:16
    container_name: eventmanager-db-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bd_event_manager
      POSTGRES_USER: event_manager_role
      POSTGRES_PASSWORD: admin
    volumes:
      - eventmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_manager_role -d bd_event_manager"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: eventmanager-minio-dev
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: dev-user
      MINIO_ROOT_PASSWORD: dev-password
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eventmanager-app-dev
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://db:5432/bd_event_manager
      DB_USERNAME: event_manager_role
      DB_PASSWORD: admin
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: dev-user
      MINIO_SECRET_KEY: dev-password
      MINIO_BUCKET_NAME: event-manager-images

volumes:
  eventmanager_pgdata: